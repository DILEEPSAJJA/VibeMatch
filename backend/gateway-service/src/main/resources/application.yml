server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: match-service
          uri: ${MATCH_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/matches/**
        - id: social-service
          uri: ${SOCIAL_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/social/**, /api/communities/**, /api/notifications/**, /api/admin/**
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/chat/**, /uploads/**
        - id: chat-websocket
          uri: ${CHAT_WS_URL:ws://localhost:8084}
          predicates:
            - Path=/ws/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
